name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # La suite corre sobre SQLite en memoria: sin servicios, sin migraciones
      # y sin depender del proyecto consumidor.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
